# poisk configuration
# Copy to ~/.config/poisk/config.toml and adjust to your setup.

[embedding]
# Any OpenAI-compatible embedding API (Ollama, LM Studio, OpenAI, etc.)
base_url = "http://localhost:11434/v1"
api_key = ""
model = "nomic-embed-text"
dimensions = 768
batch_size = 50

[search]
# Reciprocal Rank Fusion constant (higher = more weight to top-ranked results)
rrf_k = 60
# Minimum cosine similarity for vector search results (0.0-1.0)
similarity_threshold = 0.3
# Default number of results returned
default_top_k = 20
# Weighted RRF: modality contribution multipliers.
# Increase fts_weight for exact-token precision, vec_weight for semantic recall.
vec_weight = 1.0
fts_weight = 1.1
# Weighted RRF: query source multipliers.
# By default, original query sets dominate expanded variants.
original_query_weight = 1.0
expanded_query_weight = 0.25

[index]
# All supported languages are always enabled for tree-sitter AST chunking:
# go, python, rust, javascript, typescript, commonlisp
# Markdown (.md), text (.txt), and org (.org) files are always indexed.
# Directories to skip during scanning
exclude_patterns = [".git", "node_modules", "vendor", "__pycache__", ".venv", "dist", "build"]
# Skip files larger than this (in KB)
max_file_size_kb = 512

# Optional: LLM configuration for "poisk ask" and MCP ask tool.
# Requires any OpenAI-compatible chat completions API.
# [llm]
# base_url = "http://localhost:11434/v1"
# api_key = ""
# model = "llama3"
# max_context_chunks = 10
# system_prompt = "You are a helpful assistant. Answer based on the provided context."

# Add one or more [[folders]] sections to index.
# Each folder is indexed independently and can be filtered in search queries.

[[folders]]
path = "/home/user/projects/myapp"
description = "My application"

# [[folders]]
# path = "/home/user/notes"
# description = "Personal notes"
