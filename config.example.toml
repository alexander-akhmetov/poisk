# poisk configuration
# Copy to ~/.config/poisk/config.toml and adjust to your setup.

[embedding]
# Any OpenAI-compatible embedding API (Ollama, LM Studio, OpenAI, etc.)
base_url = "http://localhost:11434/v1"
api_key = ""
model = "qwen3-embedding:4b"
dimensions = 1024
batch_size = 50
send_dimensions = true
# Vector storage type: "int8" (~4x smaller index) or "float32".
# Changing this re-embeds all indexed folders.
quantization = "int8"
# Accept API vectors longer than `dimensions`, truncate and renormalize
# (Matryoshka embeddings). For providers that ignore the dimensions
# parameter, e.g. Ollama. When false, a length mismatch is an error.
matryoshka = false

[search]
# Reciprocal Rank Fusion constant (higher = more weight to top-ranked results)
rrf_k = 60
# Minimum cosine similarity for vector search results (0.0-1.0)
similarity_threshold = 0.3
# Default number of results returned
default_top_k = 20
# Weighted RRF: modality contribution multipliers.
# Increase fts_weight for exact-token precision, vec_weight for semantic recall.
vec_weight = 1.0
fts_weight = 1.1
# Weighted RRF: query source multipliers.
# By default, original query sets dominate expanded variants.
original_query_weight = 1.0
expanded_query_weight = 0.25
# Enable LLM reranking when [llm] is configured (default true).
# Set to false to disable reranking globally.
rerank = true
# Number of top retrieved results to rerank.
# Higher values may improve quality but increase latency/token cost.
rerank_top_n = 20
# Retrieval-vs-reranker blend for reranked candidates (0.0-1.0).
# Top ranks keep more retrieval signal by default; lower ranks trust reranker more.
rerank_retrieval_weight_top = 0.8
rerank_retrieval_weight_bottom = 0.2
# Drop results below this score after ranking (0 = disabled).
# Default 0.005 filters bottom-barrel noise from expanded queries.
min_score = 0.005

[index]
# All supported languages are always enabled for tree-sitter AST chunking:
# go, python, rust, javascript, typescript, commonlisp
# Markdown (.md), text (.txt), and org (.org) files are always indexed.
# Directories to skip during scanning (global default for all folders)
exclude_patterns = [".git", "node_modules", "vendor", "__pycache__", ".venv", "dist", "build"]
# File glob patterns to include (e.g. ["*.go", "*.md"]). Empty = use default extensions.
# include_patterns = []
# Skip files larger than this (in KB)
max_file_size_kb = 512

# Optional: LLM configuration for "poisk ask" and MCP ask tool.
# Requires any OpenAI-compatible chat completions API.
# [llm]
# base_url = "http://localhost:11434/v1"
# api_key = ""
# model = "llama3"
# max_context_chunks = 10
# system_prompt = "You are a helpful assistant. Answer based on the provided context."

# Add one or more [[folders]] sections to index.
# Each folder is indexed independently and can be filtered in search queries.

[[folders]]
path = "/home/user/projects/myapp"
description = "My application"
# Per-folder overrides (override global [index] defaults when set):
# exclude_patterns = ["testdata", "vendor"]
# include_patterns = ["*.go", "*.md"]
# max_file_size_kb = 512

# [[folders]]
# path = "/home/user/notes"
# description = "Personal notes"
# include_patterns = ["*.md", "*.txt", "*.org"]

# Index pi coding-agent session transcripts as searchable turn chunks.
# include_patterns is required: .jsonl is not in the default extension set, so
# without it the session files are not picked up (and unrelated .jsonl data
# files elsewhere stay out of the index).
# Session files are large (often 300KB-1MB+), so raise max_file_size_kb for
# this folder only; the global cap stays small for code folders.
# [[folders]]
# path = "~/.pi/agent/sessions"
# description = "pi coding agent sessions"
# include_patterns = ["*.jsonl"]
# max_file_size_kb = 4096
